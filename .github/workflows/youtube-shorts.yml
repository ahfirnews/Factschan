name: Fact Voltage generator and uploader

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      num_videos:
        description: Number of unique videos to generate and upload
        required: false
        default: '1'
        type: choice
        options: ['1', '2', '3']
      upload_to_youtube:
        description: Upload after validation (leave false for a safe preview)
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: fact-voltage-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NUM_VIDEOS: ${{ inputs.num_videos || '1' }}
      UPLOAD_TO_YOUTUBE: ${{ github.event_name == 'schedule' || inputs.upload_to_youtube == 'true' }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_AI_GATEWAY_ID: ${{ secrets.CLOUDFLARE_AI_GATEWAY_ID }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-montserrat
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate, validate, and upload
        run: python fact_voltage.py
      - name: Save unique-content state
        if: success()
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add shorts_db.db fact_voltage_prompt_reserve.sqlite3
          git diff --cached --quiet && exit 0
          git commit -m "chore: record published Fact Voltage episode [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Keep validated output for debugging
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fact-voltage-${{ github.run_number }}
          path: output/*.mp4
          if-no-files-found: ignore
          retention-days: 3
